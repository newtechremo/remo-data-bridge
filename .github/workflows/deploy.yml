name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: false
          script: |
            set -e

            echo "========== 배포 시작 =========="
            cd /home/finefit-temp/Desktop/project/remo-data-bridge

            # 현재 커밋 해시 저장 (롤백용)
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "현재 버전: $PREVIOUS_COMMIT"

            # 롤백 함수 정의
            rollback() {
              echo "========== 롤백 시작 =========="
              echo "이전 버전으로 롤백: $PREVIOUS_COMMIT"

              cd /home/finefit-temp/Desktop/project/remo-data-bridge
              git reset --hard $PREVIOUS_COMMIT

              # 이전 버전으로 의존성 재설치
              npm install
              npx prisma generate

              # PM2로 서버 재시작 (이전 버전)
              npm run build
              pm2 restart remo-data-bridge || pm2 start ecosystem.config.js

              echo "========== 롤백 완료 =========="
              sleep 3
              pm2 status
              exit 1
            }

            # ===== 1. Git Pull =====
            echo "1. Git Pull"
            if ! git pull origin main; then
              echo "Git Pull 실패"
              rollback
            fi

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "새 버전: $NEW_COMMIT"

            # ===== 2. 의존성 설치 =====
            echo "2. 의존성 설치"
            if ! npm install; then
              echo "npm install 실패"
              rollback
            fi

            # ===== 3. Prisma 설정 =====
            echo "3. Prisma 설정"
            if ! npx prisma generate; then
              echo "Prisma generate 실패"
              rollback
            fi

            if ! npx prisma db push; then
              echo "Prisma db push 실패"
              rollback
            fi

            # ===== 4. 빌드 =====
            echo "4. 프로덕션 빌드"
            if ! npm run build; then
              echo "빌드 실패"
              rollback
            fi

            # ===== 5. PM2로 서버 재시작 =====
            echo "5. PM2 서버 재시작"

            # logs 디렉토리 생성
            mkdir -p logs

            # PM2 프로세스가 있으면 reload, 없으면 start
            if pm2 describe remo-data-bridge > /dev/null 2>&1; then
              echo "기존 PM2 프로세스 재시작"
              pm2 reload remo-data-bridge --update-env
            else
              echo "새 PM2 프로세스 시작"
              pm2 start ecosystem.config.js
            fi

            # PM2 프로세스 저장 (시스템 재시작 시 자동 복구)
            pm2 save

            # ===== 6. 서버 헬스체크 =====
            echo "6. 서버 헬스체크"
            sleep 5

            # 서버가 정상적으로 시작되었는지 확인
            for i in 1 2 3 4 5; do
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:3015/login | grep -q "200"; then
                echo "서버 정상 시작 확인"
                break
              fi
              if [ $i -eq 5 ]; then
                echo "서버 시작 실패 - 헬스체크 실패"
                rollback
              fi
              echo "헬스체크 재시도 ($i/5)..."
              sleep 3
            done

            # ===== 완료 확인 =====
            echo "========== 배포 완료 =========="
            echo "이전 버전: $PREVIOUS_COMMIT"
            echo "현재 버전: $NEW_COMMIT"
            pm2 status
